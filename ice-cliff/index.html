<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>冰崖 · WebGL2 程序生成冰体</title>
<style>
	html, body { margin: 0; height: 100%; overflow: hidden; background: #06090e; }
	#view { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
	#view.dragging { cursor: grabbing; }
	.panel {
		position: fixed; top: 12px; left: 12px; z-index: 2;
		background: rgba(8, 14, 22, 0.72); color: #cfe3f5;
		font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace;
		border: 1px solid rgba(120, 170, 220, 0.25); border-radius: 8px;
		padding: 10px 12px; width: 240px; backdrop-filter: blur(4px);
		user-select: none;
	}
	.panel h1 { font-size: 13px; margin: 0 0 6px; color: #9fd0ff; font-weight: 600; }
	.row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
	.row label { flex: 0 0 64px; color: #8fb4d8; }
	.row output { flex: 0 0 52px; text-align: right; color: #e8f4ff; }
	.row input[type="range"] { flex: 1; accent-color: #6db3f2; height: 14px; }
	.stats { display: flex; gap: 14px; margin-bottom: 6px; color: #a8c8e8; }
	.stats b { color: #fff; font-weight: 600; }
	.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
	button {
		background: #16324a; color: #d8ecff; border: 1px solid #2f5a80;
		border-radius: 5px; padding: 4px 9px; font: 12px ui-monospace, monospace;
		cursor: pointer;
	}
	button:hover { background: #1e4262; }
	button.on { background: #2b5a86; border-color: #6db3f2; }
	.seedrow input {
		flex: 1; background: #0b1826; color: #e8f4ff; border: 1px solid #2f5a80;
		border-radius: 4px; padding: 3px 6px; font: 12px ui-monospace, monospace; width: 70px;
	}
	.hint { margin-top: 8px; color: #6d8cab; font-size: 11px; }
	#err {
		position: fixed; inset: 0; display: none; place-items: center; z-index: 3;
		color: #ffb0b0; background: #101418; font: 14px ui-monospace, monospace; padding: 24px;
	}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="panel">
	<h1>冰崖 · WebGL2</h1>
	<div class="stats">
		<span>FPS <b id="fps">--</b></span>
		<span>方位 <b id="az">--</b>°</span>
		<span>俯仰 <b id="el">--</b>°</span>
	</div>
	<div class="row"><label>太阳高度</label><input id="sun" type="range" min="2" max="60" value="42" step="0.5" /><output id="sunV">42°</output></div>
	<div class="row"><label>雾浓度</label><input id="fog" type="range" min="0" max="100" value="22" step="1" /><output id="fogV">0.022</output></div>
	<div class="row"><label>剖切平面</label><input id="cut" type="range" min="0" max="100" value="0" step="0.5" /><output id="cutV">0%</output></div>
	<div class="row seedrow"><label>种子</label><input id="seed" type="text" value="ice-7" /><button id="reseed">重新生成</button></div>
	<div class="btns">
		<button id="night">夜间模式</button>
		<button id="timelapse">录制 正午→黄昏</button>
		<button id="shot">截图</button>
	</div>
	<div class="hint">拖动环绕 · 滚轮缩放 · 剖切滑杆缓慢切掉前半块冰体</div>
</div>
<div id="err"></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
