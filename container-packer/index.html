<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>集装箱三维装箱工具</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<h1>集装箱三维装箱工具</h1>
		<p id="containerInfo"></p>
	</header>
	<main>
		<aside id="panel">
			<section>
				<h2>排布策略</h2>
				<label><input type="radio" name="strategy" value="greedy" checked> 贪心装箱（按列表顺序）</label>
				<label><input type="radio" name="strategy" value="volume"> 按体积降序</label>
			</section>
			<section>
				<h2>箱子列表（<span id="boxCount">0</span>）</h2>
				<table>
					<thead>
						<tr><th>名称</th><th>尺寸(cm)</th><th>重量(kg)</th><th>朝向</th><th>操作</th></tr>
					</thead>
					<tbody id="boxRows"></tbody>
				</table>
				<p class="hint">↑ 标记表示不可倒置；朝向选「自动」时由排布算法决定。</p>
			</section>
			<section>
				<h2>添加箱子</h2>
				<form id="addBox">
					<input id="fName" type="text" placeholder="名称">
					<div class="dims">
						<input id="fW" type="number" min="1" placeholder="长" required>
						<input id="fD" type="number" min="1" placeholder="宽" required>
						<input id="fH" type="number" min="1" placeholder="高" required>
						<input id="fWeight" type="number" min="0" placeholder="kg" required>
					</div>
					<label><input id="fKeepUp" type="checkbox"> 不可倒置</label>
					<button type="submit">添加</button>
				</form>
			</section>
			<section class="actions">
				<button id="packBtn" class="primary">开始自动排布</button>
				<button id="exportBtn" disabled>导出装箱清单</button>
				<button id="resetBtn">重置为内置12箱</button>
			</section>
		</aside>
		<section id="stage">
			<div id="viewControls">
				<button id="rotL">⟲ 左转</button>
				<button id="rotR">右转 ⟳</button>
				<label><input id="cutaway" type="checkbox"> 剖开侧壁</label>
				<span class="hint">拖动画面可旋转视角</span>
			</div>
			<canvas id="view"></canvas>
			<div id="status"></div>
			<div id="metrics"></div>
		</section>
	</main>
	<script type="module" src="js/app.js"></script>
	<script type="module">
		import { CONTAINER } from "./js/packing.js";
		document.getElementById("containerInfo").textContent =
			`${CONTAINER.name}：${CONTAINER.w}×${CONTAINER.d}×${CONTAINER.h}cm`;
	</script>
</body>
</html>
